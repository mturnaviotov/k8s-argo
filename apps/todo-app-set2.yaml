apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: todo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=zero"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: dev
                - env: prod
          - git:
              repoURL: https://github.com/mturnaviotov/k8s-argo.git
              revision: main
              files:
                - path: "environments/{{.env}}/values.yaml"
              template:
                builtins:
                  - name: "env"
                metadata:
                  name: "todo-{{.env}}"
                spec:
                  project: todo
                  destination:
                    server: https://host.docker.internal:26443
                    namespace: "todo-{{.env}}"
              jsonnet: |
                local values = std.parseYaml(std.extVar('values'));
                local tag = if std.objectHas(values, 'backend') && std.objectHas(values.backend, 'image') && std.objectHas(values.backend.image, 'tag')
                  then values.backend.image.tag
                  else 'unknown';
                {
                  backendImageTag: tag
                }
  template:
    metadata:
      name: "todo-{{.env}}"
      labels:
        app.kubernetes.io/part-of: todo-project
        tag: '{{ .backendImageTag }}'
    spec:
      project: todo
      sources:
        - repoURL: https://github.com/mturnaviotov/k8s-test-app.git
          targetRevision: main
          path: charts/
          helm:
            valueFiles:
              - $values/environments/{{.env}}/values.yaml
        - repoURL: https://github.com/mturnaviotov/k8s-argo.git
          targetRevision: main
          ref: values
      destination:
        server: https://host.docker.internal:26443
        namespace: "todo-{{.env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true