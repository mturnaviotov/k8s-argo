apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: todo
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Todo
  sourceRepos:
    - repo-argo
    - repo-app
  destinations:
    - namespace: "todo"
      name: "in-cluster"
      server: https://kubernetes.default.svc
    - namespace: "todo-dev"
      name: "in-cluster"
      server: https://kubernetes.default.svc
    - namespace: "todo-prod"
      name: "in-cluster"
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
